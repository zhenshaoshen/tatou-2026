version: "3.9"

services:
  server:
    build:
      context: server
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - user-files:/app/storage
      - ./keys:/app/keys:ro
      - ./confidential:/app/confidential:ro      # ← new

    environment:
      - PYTHONUNBUFFERED=1
      # DB connection details for future use by the API
      - SECRET_KEY=${SECRET_KEY}
      - RMAP_SERVER_PUB_PATH=/app/keys/server_pub.asc     # ← new
      - RMAP_SERVER_PRIV_PATH=/app/keys/server_priv.asc   # ← new
      - RMAP_CLIENTS_DIR=/app/keys/clients                # ← new
      - RMAP_KEY_PASSPHRASE=${RMAP_KEY_PASSPHRASE}        # ← new
      - WM_SECRET_KEY=${WM_SECRET_KEY}                    # ← new
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=tatou
      - DB_USER=${MARIADB_USER}
      - DB_PASSWORD=${MARIADB_PASSWORD}
      - FLAG_2=${FLAG_2}
      - RMAP_SOURCE_PDF=/app/confidential/Group_18.pdf    # ← new
      - RMAP_WM_METHOD=${RMAP_WM_METHOD}                  # ← new
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mariadb:11.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
      - MARIADB_DATABASE=tatou
      - MARIADB_USER=${MARIADB_USER}
      - MARIADB_PASSWORD=${MARIADB_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
      - ./db/tatou.sql:/docker-entrypoint-initdb.d/10-tatou.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root --password=$MARIADB_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "3306:3306"
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5.2
    environment:
      - PMA_HOST=db
      - PMA_PORT=3306
      - UPLOAD_LIMIT=64M     # <-- use a unit and quote if using YAML key:value form
      - MEMORY_LIMIT=256M
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
  user-files:
