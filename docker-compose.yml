services:
  server:
    build:
      context: server
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - user-files:/app/storage
      - ./keys:/app/keys:ro
      - ./confidential:/app/confidential:ro
    environment:
      - PYTHONUNBUFFERED=1
      - SECRET_KEY=${SECRET_KEY}
      - WM_SECRET_KEY=${WM_SECRET_KEY}
      - RMAP_SERVER_PUB_PATH=/app/keys/server_pub.asc
      - RMAP_SERVER_PRIV_PATH=/app/keys/server_priv.asc
      - RMAP_CLIENTS_DIR=/app/keys/clients
      - RMAP_KEY_PASSPHRASE=${RMAP_KEY_PASSPHRASE}
      - RMAP_SOURCE_PDF=/app/confidential/Group_18.pdf
      - RMAP_WM_METHOD=${RMAP_WM_METHOD}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=tatou
      - DB_USER=${MARIADB_USER}
      - DB_PASSWORD=${MARIADB_PASSWORD}
      - FLAG_2=${FLAG_2}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mariadb:11.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
      - MARIADB_DATABASE=tatou
      - MARIADB_USER=${MARIADB_USER}
      - MARIADB_PASSWORD=${MARIADB_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
      - ./db/tatou.sql:/docker-entrypoint-initdb.d/10-tatou.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root --password=$MARIADB_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No published port on purpose: MariaDB only needs to be reachable by the
    # other containers on the compose network. Publishing 3306 exposed the
    # database directly to every other group on the isolated course network.
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5.2
    environment:
      - PMA_HOST=db
      - PMA_PORT=3306
      - UPLOAD_LIMIT=64M
      - MEMORY_LIMIT=256M
    # Bound to loopback only: reachable from the VM itself (e.g. through an SSH
    # tunnel), never from another group's VM. phpMyAdmin is a high-value target.
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
  user-files:
