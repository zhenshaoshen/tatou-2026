name: ci

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Start integration environment
        env:
          MARIADB_ROOT_PASSWORD: ci-root-password
          MARIADB_USER: tatou
          MARIADB_PASSWORD: ci-password
          SECRET_KEY: ci-secret-key-for-github-actions-1234567890
          WM_SECRET_KEY: ci-watermark-key-for-github-actions-1234567890
          RMAP_KEY_PASSPHRASE: ci-rmap-passphrase-for-github-actions-1234567890
          RMAP_WM_METHOD: toy-eof
          FLAG_2: ci-flag
        run: docker compose up -d --build db server

      - name: Wait for server
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:5000/healthz; then
              echo
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs server
          exit 1

      - name: Run tests
        working-directory: server
        run: python -m pytest -q

      - name: Stop integration environment
        if: always()
        run: docker compose down -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the server image
        run: docker compose build server
