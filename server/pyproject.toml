[project]
name = "Tatou-Server"
version = "0.0.1"
description = "PDF Watermarking platform"
requires-python = ">=3.11"
dependencies = [
	"PyMuPDF>=1.21.1",
	"Flask==3.1.3",
	"gunicorn==22.0.0",
	"PyMySQL==1.1.2",
	"SQLAlchemy==2.0.43",
	"standard-imghdr>=3.13.0; python_version >= '3.13'",
	"rmap @ https://github.com/nharrand/RMAP/releases/download/v2.0.0/rmap-2.0.0-py3-none-any.whl"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["test/"]
python_files = ["test_*.py"]
markers = [
    "integration: needs a running Tatou instance (server + database); skipped when unreachable unless TATOU_REQUIRE_INTEGRATION=1",
]
pythonpath = ["src", "/app/src"]

[project.scripts]
pdfwm = "watermarking_cli:main"                 # now you can run `pdfwm methods`
